server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  location = /health { access_log off; return 200 'ok'; }
  location = /proyectos/monophone { try_files /monophone.html =404; }
  location = /privacidad { try_files /privacidad.html =404; }
  location / { try_files $uri $uri/ =404; }
  location ~ /\. { deny all; }
}
